<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>F1 Racer</title>
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Request fullscreen to dismiss browser chrome (address bar, nav bar).
    // Called on first user gesture and when starting a race.
    function tryFullscreen() {
      const el = document.documentElement;
      try {
        if      (el.requestFullscreen)            el.requestFullscreen({ navigationUI: 'hide' });
        else if (el.webkitRequestFullscreen)      el.webkitRequestFullscreen();
        else if (el.mozRequestFullScreen)         el.mozRequestFullScreen();
      } catch (_) {}
    }
  </script>
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <!-- Portrait-mode lock overlay -->
  <div id="orientationOverlay">
    <div class="rotate-content">
      <div class="rotate-icon">&#8635;</div>
      <p>Please rotate your device<br>horizontally to play.</p>
    </div>
  </div>

  <!-- Mobile in-game controls -->
  <div id="mobileControls">

    <!-- LEFT: steering -->
    <div id="leftControls">
      <button id="btnLeft"  class="ctrl-btn dpad"
        ontouchstart="touchState.left=true;resumeAudio()"
        ontouchend="touchState.left=false"
        ontouchcancel="touchState.left=false">&#9664;</button>
      <button id="btnRight" class="ctrl-btn dpad"
        ontouchstart="touchState.right=true;resumeAudio()"
        ontouchend="touchState.right=false"
        ontouchcancel="touchState.right=false">&#9654;</button>
    </div>

    <!-- RIGHT: throttle / brake / boost -->
    <div id="rightControls">
      <button id="btnBrake" class="ctrl-btn pedal brake-btn"
        ontouchstart="touchState.brake=true;resumeAudio()"
        ontouchend="touchState.brake=false"
        ontouchcancel="touchState.brake=false">BRAKE</button>
      <button id="btnGas"   class="ctrl-btn pedal gas-btn"
        ontouchstart="touchState.gas=true;resumeAudio()"
        ontouchend="touchState.gas=false"
        ontouchcancel="touchState.gas=false">GAS</button>
      <button id="btnBoost" class="ctrl-btn pedal boost-btn"
        ontouchstart="touchState.boost=true;resumeAudio()"
        ontouchend="touchState.boost=false"
        ontouchcancel="touchState.boost=false">&#9889;</button>
    </div>

    <!-- TOP-RIGHT META: pause + view toggle -->
    <div id="metaControls">
      <button id="btnView"  class="ctrl-btn meta-btn view-btn"
        ontouchstart="if(typeof toggleView==='function')toggleView()">&#127909;</button>
      <button id="btnPause" class="ctrl-btn meta-btn pause-btn"
        ontouchstart="handlePauseTap()">&#9646;&#9646;</button>
    </div>

  </div>

  <script src="js/constants.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/input.js"></script>
  <script src="js/tracks.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/cockpit.js"></script>
  <script src="js/player.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/collision.js"></script>
  <script src="js/weather.js"></script>
  <script src="js/effects.js"></script>
  <script src="js/hud.js"></script>
  <script src="js/screens.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
